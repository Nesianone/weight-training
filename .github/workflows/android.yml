name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install Capacitor and create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: App icon and colours
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          res = "android/app/src/main/res"
          sizes = {"mdpi": (48, 108), "hdpi": (72, 162), "xhdpi": (96, 216), "xxhdpi": (144, 324), "xxxhdpi": (192, 432)}
          icon = Image.open("icon-512.png").convert("RGBA")
          mask = Image.open("icon-maskable-512.png").convert("RGBA")
          for d, (legacy, fg) in sizes.items():
              icon.resize((legacy, legacy), Image.LANCZOS).save(f"{res}/mipmap-{d}/ic_launcher.png")
              icon.resize((legacy, legacy), Image.LANCZOS).save(f"{res}/mipmap-{d}/ic_launcher_round.png")
              mask.resize((fg, fg), Image.LANCZOS).save(f"{res}/mipmap-{d}/ic_launcher_foreground.png")
          open(f"{res}/values/ic_launcher_background.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B6E75</color>\n</resources>\n')
          PY

      - name: Use the same signing key every build
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lift-wall.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android app ${{ github.run_number }}
          files: lift-wall.apk
          make_latest: true
