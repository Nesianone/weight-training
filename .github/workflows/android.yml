name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Install Capacitor and create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: App icon and colours
        run: |
          RES=android/app/src/main/res
          for pair in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d legacy fg <<< "$pair"
            convert icon-512.png -resize ${legacy}x${legacy} $RES/mipmap-$d/ic_launcher.png
            convert icon-512.png -resize ${legacy}x${legacy} $RES/mipmap-$d/ic_launcher_round.png
            convert icon-maskable-512.png -resize ${fg}x${fg} $RES/mipmap-$d/ic_launcher_foreground.png
          done
          cat > $RES/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0B6E75</color>
          </resources>
          XML

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lift-wall.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android app ${{ github.run_number }}
          files: lift-wall.apk
          make_latest: true
